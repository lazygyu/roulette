<h1 class=sr-only>Open Marble - 랜덤 추첨기</h1>

<div id=settings class=settings>
  <div class=settings-resize-handle title="너비 조절" aria-hidden=true></div>
  <div class=right>
    <button id=btnToggleSettings class=btn-toggle-settings type=button>
      <span>옵션</span>
      <i class=toggle-arrow>▲</i>
    </button>
    <div class="collapsed collapsible-rows">
      <div class=row>
        <label for=sltMap>맵</label>
        <div class=map-controls>
          <select id=sltMap></select>
        </div>
      </div>

      <div class=row>
        <label for=sltSettingsPreset>설정 프리셋</label>
        <div class=map-controls>
          <select id=sltSettingsPreset></select>
          <button type=button id=btnDeleteSettingsPreset class="danger small-btn">삭제</button>
        </div>
      </div>

      <div class="row row-toggles">
        <div class=toggle-item>
          <label for=chkAutoRecording>녹화</label>
          <input type=checkbox id=chkAutoRecording>
        </div>
        <div class=toggle-item>
          <label for=chkSkill>스킬</label>
          <input type=checkbox id=chkSkill checked>
        </div>
      </div>

      <div class="row winner-row">
        <label>우승 조건</label>
        <div class=btn-group>
          <button type=button class="btn-first-winner btn-winner">처음</button>
          <button type=button class="active btn-last-winner btn-winner">마지막</button>
          <input type=number id=in_winningRank value=1 min=1 title="직접 순위">
        </div>
        <button type=button id=btnOpenExtra class=gear-btn title="색상 설정" aria-label=설정>⚙</button>
      </div>

      <div id=extraSettings class=extra-settings>
        <div class="colors-row row">
          <label>색상</label>
          <div class=color-grid>
            <label>배경 <input type=color id=in_background value=#000000></label>
            <label>벽 <input type=color id=in_wall value=#00ffff></label>
            <label>벽 글로우 <input type=color id=in_wallBloom value=#00ffff></label>
            <label>원 <input type=color id=in_circle value=#ffff00></label>
            <label>원 글로우 <input type=color id=in_circleBloom value=#ffff00></label>
            <label>라인 <input type=color id=in_line value=#ffffff></label>
            <label>라인 글로우 <input type=color id=in_lineBloom value=#00ffff></label>
            <label>스킬 <input type=color id=in_skill value=#ffffff></label>
            <label>우승 테두리 <input type=color id=in_winnerBorder value=#ffffff></label>
            <label>미니맵 <input type=color id=in_minimap value=#333333></label>
          </div>
        </div>
        <div class="row theme-save-row">
          <label for=in_settingsPresetName>테마 저장</label>
          <div class=save-row>
            <input id=in_settingsPresetName placeholder="새 테마 이름" maxlength=40>
            <button type=button id=btnAddSettingsPreset class="primary small-btn">추가</button>
          </div>
        </div>
      </div>

      <div class="row start-row">
        <button type=button id=btnStart class=btn-start-main>
          <i class="icon play"></i>
          <span>시작</span>
        </button>
      </div>
    </div>
  </div>

  <div class=left>
    <h3>이름을 입력하세요</h3>
    <textarea id=in_names placeholder="쉼표/줄바꿈 · 1~25 자동 펼침 (예: 철수,영희*2,1~5)">1~25</textarea>

    <div class=presets-block>
      <label for=sltNamePreset>이름 프리셋</label>
      <div class=map-controls>
        <select id=sltNamePreset>
          <option value>선택…</option>
        </select>
        <button type=button id=btnDeleteNamePreset class="danger small-btn">삭제</button>
      </div>
      <div class=save-row>
        <input id=in_namePresetName placeholder="새 이름 프리셋 이름">
        <button type=button id=btnAddNamePreset class="primary small-btn">프리셋 저장</button>
      </div>
    </div>
  </div>
</div>
